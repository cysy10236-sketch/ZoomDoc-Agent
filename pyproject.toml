[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomdoc-agent"
version = "0.2.0"
description = "FoveaDoc / ZoomDoc-Agent: Multi-modal document reasoning agent with PageIndex tree routing, S-BOED entropy gating, anisotropic topological foveation, and cross-modal residual verification"
readme = "ARCHITECTURE_AND_PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "langgraph",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "python-multipart",
    "pillow",
    "openai",
    "python-dotenv",
    "uvicorn",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["zoomdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
